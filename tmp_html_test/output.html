<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Viewer</title>
  <style>
    :root {
      --bg-page: #b8c6d5;
      --bg-panel: rgba(247, 250, 252, 0.9);
      --bg-card: rgba(255, 255, 255, 0.78);
      --line: rgba(18, 41, 56, 0.14);
      --ink: #183244;
      --muted: #597183;
      --accent: #0e7490;
      --shadow: 0 18px 42px rgba(20, 43, 59, 0.16);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(14, 116, 144, 0.24), transparent 28%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.14), transparent 25%),
        linear-gradient(160deg, #dfe7ee, var(--bg-page));
    }
    .app {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      gap: 18px;
      height: 100%;
      padding: 18px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      padding: 18px;
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      word-break: break-all;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
    .group {
      background: var(--bg-card);
      border: 1px solid rgba(18, 41, 56, 0.08);
      border-radius: 16px;
      padding: 14px;
    }
    .group h2 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }
    .field:last-child {
      margin-bottom: 0;
    }
    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .value {
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-weight: 500;
    }
    .inline {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .inline > * {
      flex: 1;
    }
    select, input[type="range"], input[type="color"], button {
      width: 100%;
    }
    select, button {
      border: 1px solid rgba(18, 41, 56, 0.14);
      border-radius: 12px;
      background: white;
      color: var(--ink);
      min-height: 38px;
      padding: 0 12px;
      font: inherit;
    }
    input[type="range"] {
      accent-color: var(--accent);
    }
    input[type="color"] {
      height: 38px;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(18, 41, 56, 0.14);
      background: white;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    .viewer {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(18, 41, 56, 0.12);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.9), rgba(209, 220, 230, 0.9));
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .badge {
      position: absolute;
      left: 18px;
      bottom: 18px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(18, 41, 56, 0.1);
      font-size: 12px;
      color: var(--muted);
      backdrop-filter: blur(8px);
    }
    .status {
      position: absolute;
      top: 18px;
      right: 18px;
      max-width: min(420px, calc(100% - 36px));
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 250, 250, 0.9);
      border: 1px solid rgba(148, 27, 37, 0.16);
      color: #7f1d1d;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
    }
    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .panel {
        max-height: 48vh;
        overflow: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div>
        <div class="title">box.stl</div>
        <div class="meta">
          ダブルクリックで開ける 3D HTML です。<br />
          左ドラッグ: 回転 / ホイール: 拡大縮小 / Shift + 左ドラッグ: 平行移動
        </div>
      </div>

      <section class="group">
        <h2>Display</h2>
        <div class="field">
          <label for="displayMode">表示モード</label>
          <select id="displayMode">
            <option value="solid-outline">Solid + Outline</option>
            <option value="solid">Solid</option>
            <option value="outline">Outline</option>
          </select>
        </div>
        <div class="field">
          <label for="fitView">視点</label>
          <button id="fitView" type="button">Fit View</button>
        </div>
      </section>

      <section class="group">
        <h2>Appearance</h2>
        <div class="field">
          <label for="bodyColor">本体色</label>
          <input id="bodyColor" type="color" value="#7f97aa" />
        </div>
        <div class="field">
          <label for="outlineColor">輪郭色</label>
          <input id="outlineColor" type="color" value="#10202c" />
        </div>
        <div class="field">
          <label for="backgroundColor">背景色</label>
          <input id="backgroundColor" type="color" value="#d4dee7" />
        </div>
        <div class="field">
          <label for="metalness">質感 <span class="value" id="metalnessValue"></span></label>
          <input id="metalness" type="range" min="0" max="1" step="0.01" value="0.08" />
        </div>
        <div class="field">
          <label for="roughness">粗さ <span class="value" id="roughnessValue"></span></label>
          <input id="roughness" type="range" min="0.05" max="1" step="0.01" value="0.78" />
        </div>
      </section>

      <section class="group">
        <h2>Lighting</h2>
        <div class="field">
          <label for="ambient">Ambient <span class="value" id="ambientValue"></span></label>
          <input id="ambient" type="range" min="0" max="3" step="0.05" value="1.35" />
        </div>
        <div class="field">
          <label for="keyLight">Key Light <span class="value" id="keyLightValue"></span></label>
          <input id="keyLight" type="range" min="0" max="5" step="0.05" value="2.15" />
        </div>
        <div class="field">
          <label for="fillLight">Fill Light <span class="value" id="fillLightValue"></span></label>
          <input id="fillLight" type="range" min="0" max="4" step="0.05" value="1.15" />
        </div>
        <div class="field">
          <label for="exposure">Exposure <span class="value" id="exposureValue"></span></label>
          <input id="exposure" type="range" min="0.4" max="2.5" step="0.01" value="1.15" />
        </div>
      </section>

      <section class="group">
        <h2>Outline</h2>
        <div class="field">
          <label for="edgeOpacity">線の濃さ <span class="value" id="edgeOpacityValue"></span></label>
          <input id="edgeOpacity" type="range" min="0.1" max="1" step="0.01" value="0.92" />
        </div>
        <div class="field">
          <label for="edgeThreshold">稜線角度 <span class="value" id="edgeThresholdValue"></span></label>
          <input id="edgeThreshold" type="range" min="1" max="80" step="1" value="28" />
        </div>
      </section>
    </aside>

    <main class="viewer" id="viewerShell">
      <canvas id="canvas"></canvas>
      <div class="status" id="status"></div>
      <div class="badge">推奨初期値: Solid + Outline</div>
    </main>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script>
    const stlBase64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMAAAAAACAvwAAAAAAAACAAACgwAAAIMEAACBAAACgwAAAIEEAACBAAACgwAAAIMEAACDAAAAAAACAAACAvwAAAIAAAKBAAAAgwQAAIMAAAKDAAAAgwQAAIEAAAKDAAAAgwQAAIMAAAAAAgL8AAAAAAAAAAAAAoMAAACDBAAAgwAAAoMAAACBBAAAgQAAAoMAAACBBAAAgwAAAAAAAgAAAAIAAAIC/AACgwAAAIEEAACDAAACgQAAAIMEAACDAAACgwAAAIMEAACDAAAAAAAAAAAAAgAAAgD8AAKDAAAAgwQAAIEAAAKBAAAAgQQAAIEAAAKDAAAAgQQAAIEAAAAAAAIAAAIC/AAAAgAAAoEAAACDBAAAgQAAAoMAAACDBAAAgQAAAoEAAACDBAAAgwAAAAAAAAAAAAIAAAIA/AACgQAAAIMEAACBAAACgQAAAIEEAACBAAACgwAAAIMEAACBAAAAAAACAAACAPwAAAAAAAKDAAAAgQQAAIEAAAKBAAAAgQQAAIEAAAKDAAAAgQQAAIMAAAAAAAIAAAACAAACAvwAAoEAAACBBAAAgwAAAoEAAACDBAAAgwAAAoMAAACBBAAAgwAAAAAAAgAAAgD8AAAAAAACgwAAAIEEAACDAAACgQAAAIEEAACBAAACgQAAAIEEAACDAAAAAAIA/AAAAAAAAAAAAAKBAAAAgQQAAIMAAAKBAAAAgwQAAIEAAAKBAAAAgwQAAIMAAAAAAgD8AAAAAAAAAAAAAoEAAACBBAAAgQAAAoEAAACDBAAAgQAAAoEAAACBBAAAgwAAA";
    const canvas = document.getElementById('canvas');
    const viewerShell = document.getElementById('viewerShell');
    const statusBox = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 10000);
    scene.add(camera);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.15);
    const fillLight = new THREE.DirectionalLight(0xd8ecff, 1.15);
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.7);
    keyLight.position.set(1.8, 2.4, 2.1);
    fillLight.position.set(-2.4, 1.4, -1.8);
    rimLight.position.set(-1.2, -1.6, 2.5);
    scene.add(ambientLight, keyLight, fillLight, rimLight);

    const modelRoot = new THREE.Group();
    const edgeRoot = new THREE.Group();
    scene.add(modelRoot, edgeRoot);

    const state = {
      displayMode: 'solid-outline',
      bodyColor: '#7f97aa',
      outlineColor: '#10202c',
      backgroundColor: '#d4dee7',
      metalness: 0.08,
      roughness: 0.78,
      ambient: 1.35,
      keyLight: 2.15,
      fillLight: 1.15,
      exposure: 1.15,
      edgeOpacity: 0.92,
      edgeThreshold: 28,
    };

    let currentObject = null;
    let currentBounds = null;

    function setStatus(message) {
      statusBox.style.display = message ? 'block' : 'none';
      statusBox.textContent = message || '';
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function clearGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose());
          else child.material.dispose();
        }
      }
    }

    function rebuildEdges() {
      clearGroup(edgeRoot);
      if (!currentObject) return;

      currentObject.traverse((node) => {
        if (!node.isMesh || !node.geometry) return;
        const geom = node.geometry.clone();
        geom.computeVertexNormals();
        const edges = new THREE.EdgesGeometry(geom, state.edgeThreshold);
        const lines = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({
            color: state.outlineColor,
            transparent: true,
            opacity: state.edgeOpacity,
          }),
        );
        lines.position.copy(node.position);
        lines.quaternion.copy(node.quaternion);
        lines.scale.copy(node.scale);
        edgeRoot.add(lines);
      });
      applyDisplayMode();
    }

    function applyMaterials() {
      if (!currentObject) return;
      currentObject.traverse((node) => {
        if (!node.isMesh) return;
        node.material = new THREE.MeshStandardMaterial({
          color: state.bodyColor,
          metalness: state.metalness,
          roughness: state.roughness,
          side: THREE.DoubleSide,
        });
        node.castShadow = false;
        node.receiveShadow = false;
        if (node.geometry) node.geometry.computeVertexNormals();
      });
    }

    function applyDisplayMode() {
      if (!currentObject) return;
      const solidVisible = state.displayMode !== 'outline';
      const outlineVisible = state.displayMode !== 'solid';
      currentObject.visible = solidVisible;
      edgeRoot.visible = outlineVisible;
    }

    function applySceneStyle() {
      renderer.toneMappingExposure = state.exposure;
      viewerShell.style.background =
        `radial-gradient(circle at top, rgba(255,255,255,0.88), ${state.backgroundColor})`;
      ambientLight.intensity = state.ambient;
      keyLight.intensity = state.keyLight;
      fillLight.intensity = state.fillLight;
      rimLight.intensity = Math.max(0.3, state.keyLight * 0.28);
      applyMaterials();
      rebuildEdges();
    }

    function fitCamera() {
      if (!currentBounds) return;
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      currentBounds.getSize(size);
      currentBounds.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fitHeightDistance = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
      const distance = fitHeightDistance * 1.45;

      controls.target.copy(center);
      camera.position.set(
        center.x + distance * 1.05,
        center.y + distance * 0.72,
        center.z + distance * 1.18,
      );
      camera.near = Math.max(distance / 1000, 0.01);
      camera.far = Math.max(distance * 40, 1000);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function loadModel() {
      try {
        const loader = new THREE.STLLoader();
        const geometry = loader.parse(base64ToArrayBuffer(stlBase64));
        geometry.computeBoundingBox();
        geometry.computeVertexNormals();
        geometry.center();

        currentObject = new THREE.Mesh(
          geometry,
          new THREE.MeshStandardMaterial({
            color: state.bodyColor,
            metalness: state.metalness,
            roughness: state.roughness,
            side: THREE.DoubleSide,
          }),
        );

        modelRoot.add(currentObject);
        currentBounds = new THREE.Box3().setFromObject(modelRoot);
        applySceneStyle();
        fitCamera();
        setStatus('');
      } catch (error) {
        console.error(error);
        setStatus('3Dモデルを読み込めませんでした。インターネット接続を確認してください。');
      }
    }

    function updateValue(id, value, digits = 2, suffix = '') {
      document.getElementById(id).textContent = `${Number(value).toFixed(digits)}${suffix}`;
    }

    function bindRange(id, stateKey, valueId, digits = 2, suffix = '') {
      const input = document.getElementById(id);
      const apply = () => {
        state[stateKey] = Number(input.value);
        updateValue(valueId, input.value, digits, suffix);
        applySceneStyle();
      };
      input.addEventListener('input', apply);
      updateValue(valueId, input.value, digits, suffix);
    }

    function bindColor(id, stateKey) {
      const input = document.getElementById(id);
      input.addEventListener('input', () => {
        state[stateKey] = input.value;
        applySceneStyle();
      });
    }

    document.getElementById('displayMode').addEventListener('change', (event) => {
      state.displayMode = event.target.value;
      applyDisplayMode();
    });
    document.getElementById('fitView').addEventListener('click', () => fitCamera());

    bindColor('bodyColor', 'bodyColor');
    bindColor('outlineColor', 'outlineColor');
    bindColor('backgroundColor', 'backgroundColor');
    bindRange('metalness', 'metalness', 'metalnessValue');
    bindRange('roughness', 'roughness', 'roughnessValue');
    bindRange('ambient', 'ambient', 'ambientValue');
    bindRange('keyLight', 'keyLight', 'keyLightValue');
    bindRange('fillLight', 'fillLight', 'fillLightValue');
    bindRange('exposure', 'exposure', 'exposureValue');
    bindRange('edgeOpacity', 'edgeOpacity', 'edgeOpacityValue');
    bindRange('edgeThreshold', 'edgeThreshold', 'edgeThresholdValue', 0, '°');

    function resize() {
      const width = viewerShell.clientWidth;
      const height = viewerShell.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    resize();
    loadModel();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
