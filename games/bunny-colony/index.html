<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Bunny Colony</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <canvas id="game" width="1280" height="720" aria-label="Bunny Colony game field"></canvas>
    <section id="hud" class="hidden" aria-live="polite">
      <div class="resource"><span>ニンジン</span><strong id="carrots">0</strong></div>
      <div class="resource"><span>木材</span><strong id="wood">0</strong></div>
      <div class="resource"><span>ウサギ</span><strong id="bunnies">0</strong></div>
      <div class="resource"><span>幸福度</span><strong id="happiness">0</strong></div>
      <div class="resource phase"><span id="phase">1日目・朝</span><strong id="timer">0:00</strong></div>
    </section>
    <section id="buildbar" class="hidden">
      <button data-build="burrow"><kbd>1</kbd> 巣穴 <small>木 18 / 人口+4</small></button>
      <button data-build="farm"><kbd>2</kbd> 畑 <small>木 12 / ニンジン</small></button>
      <button data-build="lumber"><kbd>3</kbd> 木こり場 <small>ニンジン 10 / 木材</small></button>
      <button data-build="watch"><kbd>4</kbd> 見張り台 <small>木 22 / 防衛</small></button>
      <button id="pause"><kbd>Esc</kbd> 一時停止</button>
    </section>
    <section id="menu" class="panel">
      <p class="eyebrow">A COZY COLONY STRATEGY GAME</p>
      <h1>Bunny<br><span>Colony</span></h1>
      <p class="tagline">小さな仲間と、7つの夜を越えよう。</p>
      <button id="newGame" class="primary">新しいコロニー</button>
      <button id="continueGame" disabled>つづきから</button>
      <button id="howToPlay">遊び方</button>
      <button id="quitGame">終了</button>
      <p class="version">VERSION 1.0.0</p>
    </section>
    <section id="modal" class="panel modal hidden" role="dialog" aria-modal="true">
      <h2 id="modalTitle">遊び方</h2>
      <div id="modalBody"></div>
      <button id="modalAction" class="primary">わかった</button>
    </section>
    <div id="toast" class="hidden" aria-live="assertive"></div>
  </main>
  <script type="module" src="src/game.js"></script>
</body>
</html>
