# Merge this into existing LiteLLM config.yaml.
# Confirm OpenCode GO API base from your account/docs before production use.
model_list:
  - model_name: opencode-go/kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: ${OPENCODE_GO_API_BASE}
      api_key: ${OPENCODE_GO_API_KEY}
  - model_name: opencode-go/glm-5.1
    litellm_params:
      model: openai/glm-5.1
      api_base: ${OPENCODE_GO_API_BASE}
      api_key: ${OPENCODE_GO_API_KEY}
  - model_name: opencode-go/deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: ${OPENCODE_GO_API_BASE}
      api_key: ${OPENCODE_GO_API_KEY}
  - model_name: opencode-go/deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: ${OPENCODE_GO_API_BASE}
      api_key: ${OPENCODE_GO_API_KEY}

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

litellm_settings:
  drop_params: true
  set_verbose: false
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
