services:
  meshy-remotion-proxy:
    build:
      context: ./clawstack_v2/apps/meshy_remotion_proxy
    container_name: meshy-remotion-proxy
    env_file:
      - .env
      - .env.meshy-remotion
    ports:
      - "127.0.0.1:${MESHY_PROXY_PORT:-18981}:8000"
    volumes:
      - ./data/meshy_assets:/data/meshy_assets
      - ./data/remotion_assets:/data/remotion_assets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - clawstack-unified_default

networks:
  clawstack-unified_default:
    external: true
