<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shannon Pentest</title>
<style>
  :root {
    --bg: #0f172a; --surface: rgba(30,41,59,0.85); --border: rgba(99,102,241,0.25);
    --accent: #6366f1; --accent2: #ec4899; --text: #e2e8f0; --muted: #94a3b8;
    --green: #22c55e; --red: #ef4444; --yellow: #f59e0b; --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif;
         min-height: 100vh; padding: 24px; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: .875rem; margin-bottom: 24px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media(max-width:700px){ .grid { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }

  /* Status */
  .status-row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.idle     { background: var(--muted); }
  .dot.running  { background: var(--yellow); animation: pulse 1.2s infinite; }
  .dot.completed{ background: var(--green); }
  .dot.failed   { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .status-label { font-size: 1.1rem; font-weight: 600; text-transform: capitalize; }
  .cost { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  .cost span { color: var(--yellow); font-weight: 600; }

  /* Controls */
  select, input { width: 100%; background: rgba(15,23,42,.8); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: .875rem; margin-bottom: 10px; }
  .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: .9rem;
         font-weight: 600; cursor: pointer; transition: opacity .2s; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-start { background: var(--accent); color: #fff; }
  .btn-stop  { background: var(--red);    color: #fff; margin-top: 8px; }
  .btn:not(:disabled):hover { opacity: .85; }
  label { font-size: .8rem; color: var(--muted); display: block; margin-bottom: 4px; }

  /* Target info */
  .info-row { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .info-row span { color: var(--text); }

  /* Log */
  .log-box { background: #0a0f1a; border: 1px solid var(--border); border-radius: 8px;
             height: 280px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: .75rem;
             line-height: 1.6; }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line.system { color: var(--accent); }
  .log-line.stderr { color: var(--yellow); }
  .log-line.log    { color: #a5f3fc; }

  /* Report */
  .report-area { display: none; }
  .report-area.visible { display: block; }
  .report-content { background: #0a0f1a; border: 1px solid var(--border); border-radius: 8px;
                    padding: 16px; max-height: 400px; overflow-y: auto;
                    font-family: monospace; font-size: .78rem; line-height: 1.7; white-space: pre-wrap; }
  .btn-report { background: var(--green); color: #000; font-weight: 700; margin-bottom: 10px; }

  /* Dialog */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
             z-index: 100; align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  .dialog { background: #1e293b; border: 1px solid var(--border); border-radius: 16px;
            padding: 28px; max-width: 420px; width: 90%; }
  .dialog h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .dialog p  { color: var(--muted); font-size: .875rem; margin-bottom: 20px; line-height: 1.6; }
  .dialog-btns { display: flex; gap: 10px; }
  .dialog-btns button { flex: 1; padding: 10px; border-radius: 8px; border: none;
                        font-size: .9rem; font-weight: 600; cursor: pointer; }
  .btn-confirm { background: var(--accent); color: #fff; }
  .btn-cancel  { background: rgba(255,255,255,.1); color: var(--text); }
</style>
</head>
<body>

<h1>🔐 Shannon Pentest</h1>
<p class="subtitle">AI-powered white-box penetration testing — powered by Shannon Lite (Keygraph)</p>

<div class="grid">
  <!-- Status card -->
  <div class="card">
    <h2>スキャン状態</h2>
    <div class="status-row">
      <div class="dot idle" id="dot"></div>
      <span class="status-label" id="statusLabel">Idle</span>
    </div>
    <div class="cost">コスト: <span id="costVal">$0.00</span></div>
    <div class="cost" id="wsInfo" style="margin-top:4px"></div>
  </div>

  <!-- Controls card -->
  <div class="card">
    <h2>スキャン設定</h2>
    <div class="info-row">ターゲット: <span id="targetUrl">読込中...</span></div>
    <div class="info-row" style="margin-bottom:10px">リポジトリ: <span>shannon_test_target</span></div>

    <label>AIモデル</label>
    <select id="modelSelect">
      <option value="openrouter,anthropic/claude-sonnet-4-5">Claude Sonnet 4.5 (推奨 ~$3)</option>
      <option value="openrouter,anthropic/claude-haiku-4-5-20251001">Claude Haiku 4.5 (高速 ~$0.5)</option>
      <option value="openrouter,anthropic/claude-opus-4-5">Claude Opus 4.5 (高精度 ~$20)</option>
      <option value="openrouter,google/gemini-2.5-flash-preview">Gemini 2.5 Flash (実験的 ~$0.5)</option>
    </select>

    <button class="btn btn-start" id="btnStart" onclick="confirmStart()">▶ スキャン開始</button>
    <button class="btn btn-stop"  id="btnStop"  onclick="stopScan()" disabled>■ 停止</button>
  </div>
</div>

<!-- Log -->
<div class="card" style="margin-bottom:16px">
  <h2>リアルタイムログ</h2>
  <div class="log-box" id="logBox"></div>
</div>

<!-- Report -->
<div class="card report-area" id="reportArea">
  <h2>スキャンレポート</h2>
  <button class="btn btn-report" onclick="downloadReport()">⬇ レポートをダウンロード</button>
  <div class="report-content" id="reportContent"></div>
</div>

<!-- Confirm dialog -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <h3>⚠️ スキャン開始の確認</h3>
    <p id="dialogMsg">このスキャンはLLM APIを使用し課金が発生します。<br>続行しますか？</p>
    <div class="dialog-btns">
      <button class="btn-cancel"  onclick="closeDialog()">キャンセル</button>
      <button class="btn-confirm" onclick="doStart()">開始する</button>
    </div>
  </div>
</div>

<script>
let eventSource = null;
let reportText  = '';

const COST_ESTIMATE = {
  'openrouter,anthropic/claude-sonnet-4-5':       '$2〜5',
  'openrouter,anthropic/claude-haiku-4-5-20251001':'$0.3〜1',
  'openrouter,anthropic/claude-opus-4-5':         '$15〜30',
  'openrouter,google/gemini-2.5-flash-preview':   '$0〜1',
};

async function loadStatus() {
  const r = await fetch('/api/status').then(r => r.json());
  document.getElementById('targetUrl').textContent = r.target || '—';
  updateUI(r.status, r.cost, r.workspace);
  if ((r.status === 'completed' || r.status === 'failed') && r.workspace) loadReport();
}

function updateUI(status, cost, ws) {
  const dot   = document.getElementById('dot');
  const label = document.getElementById('statusLabel');
  const btnStart = document.getElementById('btnStart');
  const btnStop  = document.getElementById('btnStop');
  const wsInfo   = document.getElementById('wsInfo');

  dot.className = `dot ${status}`;
  label.textContent = { idle:'待機中', running:'スキャン中', completed:'完了', failed:'エラー' }[status] || status;
  document.getElementById('costVal').textContent = `$${(cost||0).toFixed(4)}`;
  wsInfo.textContent = ws ? `Workspace: ${ws}` : '';

  btnStart.disabled = (status === 'running');
  btnStop.disabled  = (status !== 'running');
}

function confirmStart() {
  const model = document.getElementById('modelSelect').value;
  const est   = COST_ESTIMATE[model] || '不明';
  document.getElementById('dialogMsg').innerHTML =
    `このスキャンはLLM APIを使用します。<br>` +
    `<strong>推定コスト: ${est}</strong><br><br>` +
    `スキャン開始ボタンを押すと課金が始まります。続行しますか？`;
  document.getElementById('overlay').classList.add('show');
}
function closeDialog() { document.getElementById('overlay').classList.remove('show'); }

async function doStart() {
  closeDialog();
  const model = document.getElementById('modelSelect').value;
  clearLog();
  startSSE();
  await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model })
  });
  updateUI('running', 0, null);
}

async function stopScan() {
  await fetch('/api/stop', { method: 'POST' });
  updateUI('idle', 0, null);
  if (eventSource) { eventSource.close(); eventSource = null; }
}

function startSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/logs/stream');
  eventSource.onmessage = e => {
    const d = JSON.parse(e.data);
    appendLog(d.type, d.line);
    if (d.type === 'system' && (d.line.includes('completed') || d.line.includes('failed'))) {
      loadStatus();
      loadReport();
    }
  };
}

function appendLog(type, line) {
  const box = document.getElementById('logBox');
  const el  = document.createElement('div');
  el.className = `log-line ${type}`;
  el.textContent = line;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}
function clearLog() {
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('reportArea').classList.remove('visible');
}

async function loadReport() {
  const r = await fetch('/api/report').then(r => r.json());
  if (!r.report) return;
  reportText = r.report;
  document.getElementById('reportContent').textContent = r.report;
  document.getElementById('reportArea').classList.add('visible');
  const hdr = document.querySelector('#reportArea h2');
  if (r.partial) hdr.textContent = '部分レポート（分析完了分）';
  else           hdr.textContent = 'スキャンレポート（完全版）';
}

function downloadReport() {
  if (!reportText) return;
  const a = document.createElement('a');
  a.href = 'data:text/markdown;charset=utf-8,' + encodeURIComponent(reportText);
  a.download = 'shannon_report.md';
  a.click();
}

// Init
loadStatus();
setInterval(loadStatus, 5000);
// Auto-connect SSE if running
fetch('/api/status').then(r=>r.json()).then(d => { if(d.status==='running') startSSE(); });
</script>
</body>
</html>
