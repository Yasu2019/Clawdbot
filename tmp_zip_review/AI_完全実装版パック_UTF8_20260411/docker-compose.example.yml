version: "3.9"

services:
  archon-harness:
    image: python:3.11-slim
    container_name: archon-harness
    working_dir: /app
    volumes:
      - ./app:/app
      - ./logs:/logs
    env_file:
      - ./env.example
    command: ["python", "archon_harness.py"]

  hermes-loop:
    image: python:3.11-slim
    container_name: hermes-loop
    working_dir: /app
    volumes:
      - ./app:/app
      - ./logs:/logs
      - ./skills:/skills
    env_file:
      - ./env.example
    command: ["python", "hermes_learning_loop.py"]

# 注意:
# これは最小雛形です。
# 実運用では既存のLiteLLM / Langfuse / Qdrant / OpenClaw構成に合わせて統合してください。
