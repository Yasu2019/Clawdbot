name: CI Fast

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check with py_compile
        run: |
          echo "=== Python syntax check start ==="
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! python -m py_compile "$f" 2>&1; then
              echo "::error file=$f::Python syntax error: $f"
              FAILED=$((FAILED + 1))
            fi
          done < <(find . \
            -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./.git/*" \
            -not -path "*/__pycache__/*" \
            -not -path "./tmp/*" \
            -print0)
          echo "=== Python syntax check complete ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Python syntax errors were found in $FAILED files"
            exit 1
          fi
          echo "All Python files passed syntax check"

  yaml-syntax:
    name: YAML syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install yamllint

      - name: Generate yamllint config
        run: |
          cat > /tmp/.yamllint.yml << 'EOF'
          extends: relaxed
          rules:
            line-length:
              max: 200
            truthy:
              allowed-values: ["true", "false", "yes", "no", "on", "off"]
            comments:
              min-spaces-from-content: 1
            braces:
              min-spaces-inside: 0
              max-spaces-inside: 1
          EOF

      - name: YAML syntax check with yamllint
        run: |
          echo "=== YAML syntax check start ==="
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! yamllint -c /tmp/.yamllint.yml "$f" 2>&1; then
              echo "::error file=$f::YAML error: $f"
              FAILED=$((FAILED + 1))
            fi
          done < <(find . \
            \( -name "*.yml" -o -name "*.yaml" \) \
            | grep -v ".git/" \
            | grep -v ".venv/" \
            | grep -v "clawstack_v2/data/" \
            | grep -v "clawstack_v2/open-notebook/" \
            | grep -v "config/" \
            | grep -v "node_modules/" \
            | grep -v "data/workspace/projects/" \
            | grep -v "iatf_system/" \
            | grep -v "temp_" \
            | grep -v "shannon_test_target/" \
            | grep -v "scratch/" \
            | grep -v "\.tmp_" \
            | grep -v "tmp_" \
            | tr '\n' '\0')
          echo "=== YAML syntax check complete ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::YAML errors were found in $FAILED files"
            exit 1
          fi
          echo "All YAML files passed syntax check"

  workflow-lint:
    name: GitHub Actions workflow check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          ACTIONLINT_VER="1.7.12"
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: Run actionlint
        run: |
          echo "=== GitHub Actions workflow check ==="
          actionlint .github/workflows/*.yml 2>&1
          echo "Workflow check OK"

  markdown-check:
    name: Markdown check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Markdown check
        run: |
          echo "=== Markdown check start ==="
          markdownlint \
            --disable MD013 MD033 MD041 MD034 \
            '**/*.md' \
            --ignore '.venv/**' \
            --ignore 'tmp/**' \
            2>&1 || true
          echo "Markdown check complete. Warnings are non-blocking."
