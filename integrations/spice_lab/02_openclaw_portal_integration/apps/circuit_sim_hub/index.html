<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClaw Circuit Simulation Hub</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #111827; }
    header { padding: 20px 24px; background: #111827; color: white; }
    main { padding: 24px; display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    textarea { width: 100%; min-height: 320px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; border: 1px solid #d1d5db; border-radius: 12px; padding: 12px; box-sizing: border-box; }
    input, select, button { font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; }
    button { background: #111827; color: white; cursor: pointer; }
    button.secondary { background: white; color: #111827; }
    pre { white-space: pre-wrap; background: #0b1020; color: #e5e7eb; padding: 12px; border-radius: 12px; overflow: auto; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .muted { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>OpenClaw Circuit Simulation Hub</h1>
    <p>ngspice APIを使った回路シミュレーション試験カード</p>
  </header>
  <main>
    <section class="card">
      <h2>接続先</h2>
      <div class="row">
        <input id="apiBase" value="http://127.0.0.1:8765" style="min-width: 320px" />
        <button class="secondary" onclick="health()">Health Check</button>
        <select id="example">
          <option value="rc_lowpass">RC low-pass</option>
          <option value="divider_tolerance">Divider tolerance</option>
          <option value="sensor_input_filter">Sensor input filter</option>
        </select>
        <button class="secondary" onclick="loadExample()">例を読み込む</button>
      </div>
      <p class="muted">Clawstack内部から呼ぶ場合は <code>http://openclaw-spice-lab:8765</code> へ変更してください。</p>
    </section>

    <section class="card">
      <h2>ネットリスト</h2>
      <input id="simName" value="rc_lowpass" style="width: 260px" />
      <textarea id="netlist"></textarea>
      <div class="row" style="margin-top: 8px">
        <button onclick="simulate()">シミュレーション実行</button>
      </div>
    </section>

    <section class="card">
      <h2>結果</h2>
      <pre id="result">未実行</pre>
    </section>
  </main>

<script>
const $ = (id) => document.getElementById(id);
function base(){ return $('apiBase').value.replace(/\/$/, ''); }
async function health(){
  const r = await fetch(base() + '/health');
  $('result').textContent = JSON.stringify(await r.json(), null, 2);
}
async function loadExample(){
  const name = $('example').value;
  const r = await fetch(base() + '/examples/' + encodeURIComponent(name));
  const j = await r.json();
  $('simName').value = j.name;
  $('netlist').value = j.netlist;
}
async function simulate(){
  $('result').textContent = 'running...';
  const body = { name: $('simName').value, netlist: $('netlist').value };
  const r = await fetch(base() + '/simulate', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const j = await r.json();
  $('result').textContent = JSON.stringify(j, null, 2);
}
loadExample().catch(err => $('result').textContent = String(err));
</script>
</body>
</html>
