<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dときめきメモリアル風 AI学園恋愛シミュレーション | ポータル</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(22, 27, 34, 0.9);
            --primary: #f472b6;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(244, 114, 182, 0.3);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-card {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(244, 114, 182, 0.25);
            text-align: center;
        }
        .btn-launch {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
            margin: 10px;
            transition: 0.2s;
        }
        .btn-launch:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 3Dモデル主人公 動画付きAI学園恋愛シミュレーション</h1>
            <p style="color: var(--muted);">Local AI GameDev Master 統合ポータル</p>
        </header>

        <div class="app-card">
            <h2>3Dモデル主人公 ＆ シネマ動画演出ゲーム</h2>
            <p>Mixamo 3D骨組みアバター ＆ 商用基準シネマ動画演出（.mp4）を搭載した恋愛シミュレーションゲームです。</p>
            <div style="margin-top: 24px;">
                <a href="apps/growth_dashboard/3d_protagonist_game.html" class="btn-launch">✨ 3D主人公 動画付きゲームを起動する</a>
                <a href="apps/growth_dashboard/local_ai_gamedev_launcher.html" class="btn-launch" style="background: linear-gradient(135deg, var(--accent), #818cf8);">🎛️ 2D/3D切替ランチャーを起動する</a>
            </div>
        </div>
    </div>
</body>
</html>
