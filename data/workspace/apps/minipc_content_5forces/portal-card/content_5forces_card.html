<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Content 5-Forces Gate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 20px; background:#f7f7f7; color:#222; }
    .card { max-width: 980px; margin: auto; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    label { display: block; font-weight: 700; margin-top: 12px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; }
    textarea { min-height: 70px; }
    button { margin-top: 16px; padding: 12px 18px; border: none; border-radius: 12px; background: #222; color: white; font-weight: 700; cursor: pointer; }
    button:hover { opacity: .9; }
    .result { margin-top: 18px; padding: 14px; background: #f0f4ff; border-radius: 12px; white-space: pre-wrap; }
    .score { font-size: 28px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Content 5-Forces Gate</h1>
    <p>note / Kindle / YouTube / TikTok / ミニゲーム生成前に、売れるテーマかを採点します。</p>

    <label>タイトル</label>
    <input id="title" value="NEXIV測定データをExcel VBAで検査成績書へ自動転記する方法" />

    <div class="grid">
      <div>
        <label>対象読者</label>
        <input id="target_audience" value="製造業の品質保証担当者" />
      </div>
      <div>
        <label>希望媒体</label>
        <select id="preferred_platform">
          <option value="auto">auto</option>
          <option value="note" selected>note</option>
          <option value="kindle">kindle</option>
          <option value="youtube">youtube</option>
          <option value="tiktok">tiktok</option>
          <option value="minigame">minigame</option>
        </select>
      </div>
    </div>

    <label>読者の困りごと</label>
    <textarea id="pain">転記ミス、成績書作成時間、属人化</textarea>

    <label>示せる証拠・経験・サンプル</label>
    <textarea id="proof">NEXIV出力、検査成績書、VBA実務</textarea>

    <label>独自切り口</label>
    <textarea id="unique_angle">品質保証の現場で使える実装例</textarea>

    <button onclick="evaluateIdea()">採点する</button>

    <div id="result" class="result">API起動後に採点できます: http://localhost:18766</div>
  </div>

<script>
async function evaluateIdea() {
  const payload = {
    title: document.getElementById("title").value,
    target_audience: document.getElementById("target_audience").value,
    pain: document.getElementById("pain").value,
    proof: document.getElementById("proof").value,
    unique_angle: document.getElementById("unique_angle").value,
    preferred_platform: document.getElementById("preferred_platform").value,
    confidential_level: "public_sample"
  };

  const resultDiv = document.getElementById("result");
  resultDiv.textContent = "採点中...";

  try {
    const res = await fetch("http://localhost:18766/evaluate", {
      method: "POST",
      headers: {"Content-Type": "application/json; charset=utf-8"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    resultDiv.innerHTML =
      `<div class="score">${data.total_score}点</div>` +
      `<b>判定:</b> ${escapeHtml(data.decision)}\n` +
      `<b>推奨媒体:</b> ${escapeHtml(data.recommended_platform)}\n\n` +
      `<b>リスク:</b>\n${data.risks.map(x => "- " + escapeHtml(x)).join("\n")}\n\n` +
      `<b>次のアクション:</b>\n${data.next_actions.map(x => "- " + escapeHtml(x)).join("\n")}\n\n` +
      `<b>構成案:</b>\n${data.outline.map(x => "- " + escapeHtml(x)).join("\n")}`;
  } catch (e) {
    resultDiv.textContent = "APIに接続できません。先に scripts/run_windows_utf8.ps1 または docker compose up --build を実行してください。\n" + e;
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[s]));
}
</script>
</body>
</html>
