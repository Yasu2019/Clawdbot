<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Tool Attention Monitor</title>
<style>body{font-family:system-ui;margin:24px;background:#0f172a;color:#e5e7eb}.card{background:#111827;border:1px solid #334155;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#86efac}.warn{color:#fde68a}.bad{color:#fca5a5}input,button,textarea{font-size:16px;border-radius:10px;padding:10px;margin:4px}textarea{width:100%;height:90px}</style></head>
<body><h1>Tool Attention Monitor</h1><div class="card"><p>目的: MCP税削減、ツール選択精度、異常検知を監視します。</p><textarea id="q">プレス機のSPMデータをNode-RED経由で確認したい</textarea><br><button onclick="route()">Route Test</button><button onclick="ranking()">Learning Ranking</button></div><div id="out"></div>
<script>
async function route(){const text=document.getElementById('q').value;const body={text,state:{db_connected:true,mqtt_connected:true,nodered_connected:true,paperless_connected:true,github_connected:true,write_allowed:false,human_approved:false},limit:10};const r=await fetch('http://localhost:8090/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('out').innerHTML='<pre>'+JSON.stringify(await r.json(),null,2)+'</pre>'}
async function ranking(){const r=await fetch('http://localhost:8092/ranking');document.getElementById('out').innerHTML='<pre>'+JSON.stringify(await r.json(),null,2)+'</pre>'}
</script></body></html>
