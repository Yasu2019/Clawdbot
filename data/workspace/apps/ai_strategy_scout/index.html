<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Strategy Scout | Clawstack V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #818cf8; /* Indigo */
            --secondary: #ec4899; /* Pink */
            --tertiary: #06b6d4; /* Cyan */
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.15), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1), transparent 30%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.4rem; font-weight: 700; display: block; margin-top: 5px; color: var(--tertiary); }

        .scout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        @media (max-width: 600px) {
            .scout-grid { grid-template-columns: 1fr; }
        }

        .category-block {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .category-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
        }

        .category-block:nth-child(2)::before { background: var(--secondary); }
        .category-block:nth-child(3)::before { background: var(--tertiary); }

        .category-block h2 {
            font-size: 1.5rem;
            margin: 0 0 25px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .entry-list { display: flex; flex-direction: column; gap: 20px; }

        .entry-item {
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .entry-item:hover { transform: translateX(5px); }
        .entry-item:last-child { border-bottom: none; }

        .entry-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
        }

        .entry-title:hover { color: var(--primary); }

        .entry-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .footer-info {
            margin-top: 60px;
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Strategy Scout</h1>
            <p>Antigravity's autonomous trend monitoring and system optimization hub.</p>
        </header>

        <div class="stats-strip" id="stats">
            <!-- Stats will be populated here -->
        </div>

        <div class="scout-grid" id="main-grid">
            <!-- Categories will be populated here -->
        </div>

        <div class="footer-info">
            <p>This report is generated daily by the <strong>AI Strategy Bot</strong> (n8n workflow). <br>
            Older entries are archived every 30 days to maintain memory hygiene. <br>
            <a href="http://localhost:5679/workflow/OhaDNimNp68psAYq" class="btn" target="_blank">View Automation Workflow</a>
            </p>
        </div>
    </div>

    <script>
        async function loadDigest() {
            try {
                const response = await fetch('../../ai_strategy_digest.json', { cache: 'no-store' });
                const data = await response.json();

                const stats = document.getElementById('stats');
                stats.innerHTML = `
                    <div class="stat-card"><span class="stat-label">Last Updated</span><span class="stat-value">${data.generatedAt}</span></div>
                    <div class="stat-card"><span class="stat-label">Sources</span><span class="stat-value">${data.sourcesChecked} Active</span></div>
                    <div class="stat-card"><span class="stat-label">Window</span><span class="stat-value">${data.windowDays} Days</span></div>
                    <div class="stat-card"><span class="stat-label">Hygiene</span><span class="stat-value">30d Rotation</span></div>
                `;

                const grid = document.getElementById('main-grid');
                grid.innerHTML = Object.entries(data.categories).map(([name, items]) => `
                    <div class="category-block">
                        <h2>${name}</h2>
                        <div class="entry-list">
                            ${items.map(item => `
                                <div class="entry-item">
                                    <a href="${item.url}" class="entry-title" target="_blank">${item.title}</a>
                                    <div class="entry-meta">
                                        <span>${item.source}</span>
                                        <span class="badge">${item.published.split('T')[0]}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error("Failed to load digest", e);
                document.getElementById('main-grid').innerHTML = "<p>Data unavailable. Ensure n8n is running.</p>";
            }
        }

        loadDigest();
    </script>
</body>
</html>
