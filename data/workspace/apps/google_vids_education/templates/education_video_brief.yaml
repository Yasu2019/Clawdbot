title: "バリ不良の基礎教育"
audience: "新人検査員・プレス作業者"
video_length: "3min"
process: "プレス加工"
defect_type: "バリ"
objective: "バリ不良の見つけ方、原因、初動対応を理解する"
source_documents:
  - "内部不具合報告書"
  - "作業標準書"
  - "検査基準書"
confidentiality_level: "Internal-B"
masking_required: true
