<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Factory - Clawstack</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        :root {
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.3);
        }

        body {
            background: #0a0a0c;
            color: #e0e0e0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: #121215;
            border-right: 1px solid #2a2a30;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-view {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            overflow-y: auto;
        }

        .panel {
            background: #18181b;
            border: 1px solid #2a2a30;
            border-radius: 12px;
            padding: 24px;
        }

        h1,
        h2 {
            margin: 0;
            color: #fff;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea,
        input,
        select {
            background: #0a0a0c;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .preview-box {
            aspect-ratio: 9/16;
            width: 300px;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #3f3f46;
            margin: 0 auto;
        }

        .tag {
            background: #27272a;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 12px;
            color: #a1a1aa;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>🎬 Video Studio</h2>
        <div class="input-group">
            <label>動画のテーマ / プロンプト</label>
            <textarea id="prompt" rows="5" placeholder="例: 宇宙の神秘について解説する60秒のショート動画"></textarea>
        </div>
        <div class="input-group">
            <label>AIボイス</label>
            <select id="voice-engine">
                <option value="voicevox">VOICEVOX (四国めたん)</option>
                <option value="coqui">Coqui TTS (Crystal)</option>
            </select>
        </div>
        <div class="input-group">
            <label>アスペクト比</label>
            <select id="ratio">
                <option value="9:16">9:16 (TikTok/Shorts)</option>
                <option value="16:9">16:9 (YouTube)</option>
            </select>
        </div>
        <button class="btn-primary" onclick="generateVideo()">✨ 動画を生成</button>

        <hr style="border:0; border-top:1px solid #2a2a30; margin: 10px 0;">

        <div class="input-group">
            <label>📸 写真補正 (現代版・カラー化)</label>
            <input type="file" id="photo-upload">
            <button class="btn-primary" style="background: #3b82f6; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);"
                onclick="restorePhoto()">🖼️ AIリマスター</button>
        </div>
    </div>

    <div class="main-view">
        <div class="panel">
            <h1>生成プレビュー</h1>
            <p>Remotionレンダラーによるリアルタイムプレビューです。</p>
            <div class="preview-box" id="preview-box">
                <span style="color: #52525b;" id="preview-placeholder">レンダリング待機中</span>
                <video id="preview-video" style="display:none; width:100%; border-radius:10px;"
                       controls playsinline></video>
            </div>

            <!-- サンプル動画 -->
            <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-primary" style="background:#1a1a2e; border:1px solid #555; font-size:12px;"
                        onclick="playSample('output/metal_short_sample.mp4', '🎸 ベーシック版')">
                    🎸 ベーシック
                </button>
                <button class="btn-primary" style="background:#1a1a2e; border:1px solid #ff6600; font-size:12px;"
                        onclick="playSample('output/metal_mv_enhanced.mp4', '🔥 MV強化版（炎・稲妻・波形）')">
                    🔥 MV強化版
                </button>
                <button class="btn-primary" style="background:#1a1a2e; border:1px solid #22c55e; font-size:12px;"
                        onclick="playSample('output/metal_mv_bgm.mp4', '🎵 MV強化版＋BGM（ヘビーメタルギター）')">
                    🎵 MV＋BGM ★
                </button>
                <button class="btn-primary" style="background:#1a1a2e; border:1px solid #a855f7; font-size:12px;"
                        onclick="playSample('output/metal_anime_bgm.mp4', '🤖 アニメ＋口パク＋BGM')">
                    🤖 アニメ＋BGM ★
                </button>
                <button class="btn-primary" id="btn-sd" style="background:#1a1a2e; border:1px solid #f59e0b; font-size:12px; opacity:0.5;"
                        onclick="playSample('output/metal_sd_final.mp4', '✨ SDキャラ版（Stable Diffusion）')"
                        disabled>
                    ✨ SDキャラ版（生成中…）
                </button>
                <a id="download-link" style="display:none;" download>
                    <button class="btn-primary" style="background:#222; border:1px solid #22c55e; font-size:13px;">
                        ⬇️ ダウンロード
                    </button>
                </a>
            </div>
        </div>

        <div class="panel">
            <h2>生成ログ / 進捗</h2>
            <div id="log"
                style="font-family: monospace; color: #a1a1aa; font-size: 13px; height: 150px; overflow-y: auto;">
                > System initialized.<br>
                > VOICEVOX engine ready. (青山龍星・熱血)<br>
                > FFmpeg pipeline ready.<br>
                > Sample: metal_short_sample.mp4 (4.4MB / 30sec) ✅
            </div>
        </div>
    </div>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.innerHTML += `<br>> ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        function playSample(src, title) {
            const video = document.getElementById('preview-video');
            const placeholder = document.getElementById('preview-placeholder');
            const dl = document.getElementById('download-link');
            video.src = src;
            video.style.display = 'block';
            placeholder.style.display = 'none';
            video.play();
            dl.href = src;
            dl.style.display = 'inline';
            log(`▶ 再生: ${title}`);
        }

        async function generateVideo() {
            log("Script generating via LLM...");
            setTimeout(() => log("Generating audio via VOICEVOX (青山龍星・熱血)..."), 1500);
            setTimeout(() => log("Rendering frames... (Pillow + FFmpeg)"), 3000);
            setTimeout(() => {
                log("✅ Video ready: metal_short_sample.mp4");
                playSample('output/metal_short_sample.mp4', '生成完了');
            }, 5000);
        }

        async function restorePhoto() {
            log("Uploading photo to Stable Diffusion API...");
            log("Processing: DeOldify + Real-ESRGAN...");
            setTimeout(() => log("✅ Image restored. Saved to outputs/remastered_01.png"), 2500);
        }
    </script>
</body>

</html>
