<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM / OSS Scout</title>
    <style>
        :root {
            --bg: #09111f;
            --panel: rgba(15, 23, 42, 0.85);
            --line: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-2: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 30%),
                radial-gradient(circle at top right, rgba(34, 197, 94, 0.12), transparent 24%),
                var(--bg);
        }

        .shell {
            width: min(1280px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .hero,
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
        }

        .hero {
            padding: 28px;
            margin-bottom: 24px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(1.8rem, 2vw, 2.6rem);
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .meta-grid,
        .category-grid {
            display: grid;
            gap: 16px;
        }

        .meta-grid {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-top: 18px;
        }

        .meta-card {
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(2, 6, 23, 0.35);
        }

        .meta-label {
            display: block;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .meta-value {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .panel {
            padding: 24px;
            margin-bottom: 20px;
        }

        .panel h2 {
            margin: 0 0 14px;
            font-size: 1.2rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border-radius: 999px;
            text-decoration: none;
            color: #03111f;
            background: linear-gradient(135deg, var(--accent), #7dd3fc);
            font-weight: 700;
        }

        .button.secondary {
            color: var(--text);
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid var(--line);
        }

        .category-grid {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .category-card {
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            background: rgba(2, 6, 23, 0.32);
        }

        .category-card h3 {
            margin: 0 0 12px;
            color: var(--accent);
        }

        .entry {
            padding: 12px 0;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
        }

        .entry:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .entry-title {
            margin: 0 0 6px;
            font-weight: 700;
            line-height: 1.45;
        }

        .entry-meta {
            color: var(--muted);
            font-size: 0.92rem;
            margin-bottom: 6px;
        }

        .entry a {
            color: #7dd3fc;
            word-break: break-all;
        }

        .health-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .health-item {
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 16px;
            background: rgba(2, 6, 23, 0.3);
        }

        .ok {
            color: var(--accent-2);
            font-weight: 700;
        }

        .error {
            color: #fca5a5;
            font-weight: 700;
        }

        .empty {
            color: var(--muted);
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="shell">
        <section class="hero">
            <h1>Local LLM / OSS Scout</h1>
            <p>公開 RSS / 公開ホームページ / 公開 GitHub Releases だけを使って、ローカル LLM とオープンソース仕事効率化アプリの新着を日次で確認します。有料 API やクラウド LLM は使いません。</p>
            <div class="meta-grid" id="meta-grid"></div>
            <div class="actions">
                <a class="button" href="../../local_llm_oss_digest.md" target="_blank" rel="noopener">Markdown を開く</a>
                <a class="button secondary" href="../../local_llm_oss_digest.json" target="_blank" rel="noopener">JSON を開く</a>
                <a class="button secondary" href="http://localhost:5679/workflow/OhaDNimNp68psAYq" target="_blank" rel="noopener">n8n Workflow</a>
            </div>
        </section>

        <section class="panel">
            <h2>Latest Digest</h2>
            <div class="category-grid" id="category-grid"></div>
        </section>

        <section class="panel">
            <h2>Source Health</h2>
            <div class="health-list" id="health-list"></div>
        </section>
    </div>

    <script>
        const metaGrid = document.getElementById('meta-grid');
        const categoryGrid = document.getElementById('category-grid');
        const healthList = document.getElementById('health-list');

        function metaCard(label, value) {
            return `
                <div class="meta-card">
                    <span class="meta-label">${label}</span>
                    <span class="meta-value">${value}</span>
                </div>
            `;
        }

        function renderEntry(entry) {
            const published = entry.published ? entry.published.slice(0, 10) : 'reference';
            return `
                <article class="entry">
                    <p class="entry-title">${entry.title}</p>
                    <div class="entry-meta">${published} / ${entry.source}</div>
                    <a href="${entry.url}" target="_blank" rel="noopener">${entry.url}</a>
                </article>
            `;
        }

        fetch('../../local_llm_oss_digest.json', { cache: 'no-store' })
            .then((resp) => resp.json())
            .then((data) => {
                metaGrid.innerHTML = [
                    metaCard('Generated At', data.generatedAt || '-'),
                    metaCard('Window', `${data.windowDays || '-'} days`),
                    metaCard('Sources Checked', String(data.sourcesChecked ?? '-')),
                    metaCard('Policy', 'No paid API / public sources only'),
                ].join('');

                const categories = data.categories || {};
                categoryGrid.innerHTML = Object.entries(categories).map(([name, rows]) => `
                    <section class="category-card">
                        <h3>${name}</h3>
                        ${rows && rows.length ? rows.map(renderEntry).join('') : '<p class="empty">No items found.</p>'}
                    </section>
                `).join('');

                const sources = data.sourceResults || [];
                healthList.innerHTML = sources.map((item) => `
                    <div class="health-item">
                        <div>${item.source}</div>
                        <div class="${String(item.status).startsWith('ok') ? 'ok' : 'error'}">${item.status}</div>
                        <div class="entry-meta">${(item.items || []).length} items</div>
                    </div>
                `).join('');
            })
            .catch((error) => {
                metaGrid.innerHTML = metaCard('Load Error', error.message || String(error));
                categoryGrid.innerHTML = '<p class="empty">Digest file could not be loaded.</p>';
                healthList.innerHTML = '';
            });
    </script>
</body>

</html>
