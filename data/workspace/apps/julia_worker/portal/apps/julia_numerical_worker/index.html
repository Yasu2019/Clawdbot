<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Julia Numerical Worker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; background:#f7f7f8; color:#222; }
    .card { max-width: 1100px; margin:auto; background:white; border-radius:18px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    label { display:block; font-size:13px; color:#555; margin-bottom:4px; }
    input { width:100%; box-sizing:border-box; padding:10px; border:1px solid #ddd; border-radius:10px; }
    button { border:0; border-radius:12px; padding:12px 18px; cursor:pointer; font-weight:700; margin-top:16px; }
    button.primary { background:#111827; color:white; }
    pre { background:#111827; color:#e5e7eb; padding:16px; border-radius:14px; overflow:auto; min-height:160px; }
    .note { background:#fff7ed; border:1px solid #fed7aa; padding:12px; border-radius:12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Julia Numerical Worker</h1>
    <p>DOE・最適化・レベラー条件探索・CAE補助用のJulia高速数値計算Workerです。</p>

    <div class="note">
      この画面は既存Portalに追加するカード雛形です。正式導入時はnginx/API GatewayのURLに合わせて <code>API_BASE</code> を調整してください。
    </div>

    <h2>レベラー簡易推定</h2>
    <div class="grid">
      <div><label>板厚 mm</label><input id="thickness_mm" value="0.8"></div>
      <div><label>降伏応力 MPa</label><input id="yield_mpa" value="85"></div>
      <div><label>ロール径 mm</label><input id="roller_diameter_mm" value="12"></div>
      <div><label>ピッチ mm</label><input id="pitch_mm" value="16"></div>
      <div><label>入口ギャップ mm</label><input id="entry_gap_mm" value="0.7"></div>
      <div><label>出口ギャップ mm</label><input id="exit_gap_mm" value="1.1"></div>
      <div><label>段数</label><input id="stages" value="11"></div>
      <div><label>摩擦係数</label><input id="friction" value="0.05"></div>
    </div>
    <button class="primary" onclick="runEstimate()">計算する</button>

    <h2>結果</h2>
    <pre id="result">ここに結果が表示されます。</pre>
  </main>

<script>
const API_BASE = "http://localhost:8097";

function val(id) {
  const x = document.getElementById(id).value;
  return Number(x);
}

async function runEstimate() {
  const payload = {
    thickness_mm: val("thickness_mm"),
    yield_mpa: val("yield_mpa"),
    roller_diameter_mm: val("roller_diameter_mm"),
    pitch_mm: val("pitch_mm"),
    entry_gap_mm: val("entry_gap_mm"),
    exit_gap_mm: val("exit_gap_mm"),
    stages: Math.round(val("stages")),
    friction: val("friction")
  };
  const out = document.getElementById("result");
  out.textContent = "計算中...";
  try {
    const res = await fetch(`${API_BASE}/leveler/estimate`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = "ERROR: " + e.toString();
  }
}
</script>
</body>
</html>
