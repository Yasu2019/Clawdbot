# 既存 clawstack-unified の docker compose に追加するための例です。
# 既存 docker-compose.yml を直接編集せず、以下のように使うことを推奨します。
#
# docker compose \
#   -f docker-compose.yml \
#   -f docker-compose.julia-worker.override.yml \
#   up -d --build julia-numerical-worker julia-python-bridge
#
# 注意:
#   - 既存ネットワーク名は環境に合わせて修正してください。
#   - Portal/nginx 側の設定は docs/PORTAL_CARD_INTEGRATION.md を参照してください。

services:
  julia-numerical-worker:
    build:
      context: ./services/julia-worker
      dockerfile: Dockerfile
    container_name: clawstack-julia-numerical-worker
    restart: unless-stopped
    environment:
      JULIA_NUM_THREADS: "auto"
      JULIA_WORKER_HOST: "0.0.0.0"
      JULIA_WORKER_PORT: "8096"
      READ_ONLY_MODE: "true"
    ports:
      - "127.0.0.1:8096:8096"
    networks:
      - clawstack_net

  julia-python-bridge:
    build:
      context: ./services/python-bridge
      dockerfile: Dockerfile
    container_name: clawstack-julia-python-bridge
    restart: unless-stopped
    environment:
      JULIA_WORKER_URL: "http://julia-numerical-worker:8096"
      PYTHON_BRIDGE_PORT: "8097"
    ports:
      - "127.0.0.1:8097:8097"
    depends_on:
      - julia-numerical-worker
    networks:
      - clawstack_net

networks:
  clawstack_net:
    external: true
