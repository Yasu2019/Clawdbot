<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenClaw Auto LP Generator</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#081320;color:#eaf2ff;margin:0;padding:24px}.card{max-width:980px;margin:auto;background:#0f1f35;border:1px solid #29435f;border-radius:24px;padding:24px}label{display:block;margin-top:14px;color:#9fb4d1}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #29435f;background:#07111f;color:#eaf2ff}button{margin-top:18px;margin-right:8px;padding:12px 18px;border:0;border-radius:14px;background:#58a6ff;color:white;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#07111f;border:1px solid #29435f;border-radius:16px;padding:16px}a{color:#7dd3fc}</style></head><body><div class="card"><h1>OpenClaw Auto LP Generator</h1><p>品質保証・工程可視化・IATF説明・顧客向けLPを生成します。</p><label>タイトル</label><input id="title" value="品質保証ダッシュボード"><label>サブタイトル</label><input id="subtitle" value="製造現場の状況を、顧客・監査員・社内責任者に分かりやすく説明します。"><label>テーマ</label><input id="theme" value="quality_dashboard"><label>対象</label><input id="target" value="製造業の品質責任者"><label>トンマナ</label><input id="tone" value="工業的、信頼感、ブルー基調、ミニマル"><label>セクション（1行1項目）</label><textarea id="sections" rows="6">KPIサマリー
工程フロー
不良率の推移
是正処置フロー
問い合わせ</textarea><label>メモ</label><textarea id="notes" rows="4">顧客説明、監査説明、社内DXポータル掲載を想定。</textarea><button onclick="generate()">LP生成</button><button onclick="suggest()">構成案作成</button><h2>結果</h2><pre id="result"></pre></div><script>async function generate(){const payload={title:title.value,subtitle:subtitle.value,theme:theme.value,target:target.value,tone:tone.value,sections:sections.value.split("\n").map(x=>x.trim()).filter(Boolean),notes:notes.value};const res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await res.json();result.innerHTML=JSON.stringify(data,null,2)+"\n\nOpen: <a href='"+data.url+"' target='_blank'>"+data.url+"</a>"}async function suggest(){const res=await fetch("/api/suggest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({theme:theme.value})});const data=await res.json();result.textContent=JSON.stringify(data,null,2)}</script></body></html>
