services:
  openclaw-auto-lp-generator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: openclaw_auto_lp_generator
    env_file:
      - .env
    ports:
      - "${AUTO_LP_HOST:-127.0.0.1}:${AUTO_LP_PORT:-8010}:8000"
    volumes:
      - ./app/generated:/app/generated
      - ./examples:/app/examples:ro
      - ./rag:/app/rag:ro
    restart: unless-stopped
    networks:
      - openclaw_auto_lp_net
networks:
  openclaw_auto_lp_net:
    driver: bridge
