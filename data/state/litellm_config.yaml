model_list:
  # ── OpenCode GO v2: Research alias + Local safe review (Added 2026-04-28) ──
  # 外部公開情報調査専用エイリアス。機密データ投入禁止。
  - model_name: opencode-go-research
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-Qed9ZqA3yf9jN2Xo7xOHHaD3d9YzO5suCgM1MamKYXuKmnsXpTPX6YD28MrII8LL
      timeout: 120
    model_info:
      mode: external_public_research_only
  # 機密情報含むレビューはローカルのみ
  - model_name: local-safe-review
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      api_key: ollama
    model_info:
      mode: local_confidential_review_allowed

  # ── OpenCode GO External AI Layer (Added 2026-04-28) ────────────
  # 外部情報収集・有益性評価・差分案作成用。機密データ投入禁止。
  - model_name: opencode-go/kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-Qed9ZqA3yf9jN2Xo7xOHHaD3d9YzO5suCgM1MamKYXuKmnsXpTPX6YD28MrII8LL
      timeout: 300
  - model_name: opencode-go/glm-5.1
    litellm_params:
      model: openai/glm-5.1
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-Qed9ZqA3yf9jN2Xo7xOHHaD3d9YzO5suCgM1MamKYXuKmnsXpTPX6YD28MrII8LL
      timeout: 300
  - model_name: opencode-go/deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-Qed9ZqA3yf9jN2Xo7xOHHaD3d9YzO5suCgM1MamKYXuKmnsXpTPX6YD28MrII8LL
      timeout: 300
  - model_name: opencode-go/deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-Qed9ZqA3yf9jN2Xo7xOHHaD3d9YzO5suCgM1MamKYXuKmnsXpTPX6YD28MrII8LL
      timeout: 300

  # ── DeepSeek V4 Production Layer (Added 2026-04-28) ─────────────
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-chat
      api_base: https://api.deepseek.com/v1
      api_key: "${DEEPSEEK_API_KEY}"
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-chat
      api_base: https://api.deepseek.com/v1
      api_key: "${DEEPSEEK_API_KEY}"

  # ── Claudian Protocol Aliases (2026-04-09) ──────────────────────
  - model_name: claude
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      api_key: ollama
  - model_name: codex
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      api_key: ollama
  - model_name: ollama
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama:11434
      api_key: ollama
  # ── LightRAG 専用: thinking 無効化済み qwen3 (2026-04-17) ────────
  # バッチ処理・グラフ抽出に使用。thinking=off で高速化
  - model_name: local_fast_nothink
    litellm_params:
      model: ollama/qwen3-nothink
      api_base: http://ollama:11434
      api_key: ollama

  # ── OpenAI Cloud Layer (Added 2026-04-22) ────────────────────────
  - model_name: openai/gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: "${CLOUD_OPENAI_API_KEY}"
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: "${CLOUD_OPENAI_API_KEY}"

  # ── Kimi Moonshot AI (Added 2026-04-22) ──────────────────────────
  - model_name: openai/kimi-agent-primary
    litellm_params:
      model: kimi-k2.6
      custom_llm_provider: openai
      api_key: "${MOONSHOT_API_KEY}"
      api_base: "${KIMI_BASE_URL}"
      timeout: 180
      max_retries: 2
  - model_name: openai/kimi-vision-primary
    litellm_params:
      model: kimi-k2.6
      custom_llm_provider: openai
      api_key: "${MOONSHOT_API_KEY}"
      api_base: "${KIMI_BASE_URL}"
      timeout: 180
      max_retries: 2
  - model_name: openai/kimi-agent-with-fallback
    litellm_params:
      model: kimi-k2.6
      custom_llm_provider: openai
      api_key: "${MOONSHOT_API_KEY}"
      api_base: "${KIMI_BASE_URL}"
      timeout: 180
      max_retries: 2

  # ── Lemonade Multimodal Layer (2026-04-12) ─────────────────────
  - model_name: lemonade-speech
    litellm_params:
      model: openai/whisper-large-v3
      api_base: http://lemonade:8000/v1
      api_key: local-dev-key
  - model_name: lemonade-image
    litellm_params:
      model: openai/stable-diffusion-xl
      api_base: http://lemonade:8000/v1
      api_key: local-dev-key
  - model_name: lemonade-multimodal
    litellm_params:
      model: openai/gpt-4o-compat
      api_base: http://lemonade:8000/v1
      api_key: local-dev-key

  # Optional experimental local Gemma 4 overlay:
  # data/state/litellm_config.gemma4.experimental.yaml
  # ── Local (Ollama via OpenAI-compat /v1) ────────────────────────
  # LiteLLM v1.10.1: model_name must use a recognized provider prefix
  # so the router can validate it before routing to litellm_params.
  - model_name: openai/gemma4
    litellm_params:
      model: ollama/gemma4:e2b
      api_base: http://ollama:11434
      api_key: ollama
  - model_name: openai/qwen3
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      api_key: ollama
  - model_name: local_fast
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      api_key: ollama

  # ── Cloud (Gemini — for LiteLLM proxy routing if needed) ────────
  - model_name: google/gemini-2.5-flash
    litellm_params:
      model: openai/gemini-2.5-flash
      api_base: https://generativelanguage.googleapis.com/v1beta/openai
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini/gemini-2.5-flash
    litellm_params:
      model: openai/gemini-2.5-flash
      api_base: https://generativelanguage.googleapis.com/v1beta/openai
      api_key: os.environ/GEMINI_API_KEY

  # ── Embeddings (OpenClaw memory search) ─────────────────────────
  - model_name: text-embedding-ada-002
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      api_key: none
  - model_name: text-embedding-3-small
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      api_key: none
  - model_name: text-embedding-3-large
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      api_key: none
  - model_name: mixedbread-ai/mxbai-embed-large-v1
    litellm_params:
      model: openai/mixedbread-ai/mxbai-embed-large-v1
      api_base: http://infinity:7997
      api_key: local-dev-key
  # nomic-embed-text はチャット補完のフォールバック対象から除外
  # (直接 Ollama v1/embeddings で利用するため LiteLLM 経由不要)

router_settings:
  enable_pre_call_check: false   # 起動時モデルヘルスチェック無効（Ollama遅延でのブロック防止）
  num_retries: 0
  fallbacks: []                  # フォールバック完全無効 — Gemini への誤流入を防ぐ

litellm_settings:
  drop_params: true
  set_timeout: 120

environment_variables:
  # Monitoring & Portals
  LANGFUSE_PUBLIC_KEY: "pk-lf-07926c92-5480-4fb5-ae97-39e35a0a0ce5"
  LANGFUSE_SECRET_KEY: "os.environ/LANGFUSE_SECRET_KEY"
  LANGFUSE_HOST: "http://langfuse:3000"
  # Cloud Token Pass-through
  MOONSHOT_API_KEY: "os.environ/MOONSHOT_API_KEY"
  KIMI_BASE_URL: "os.environ/KIMI_BASE_URL"
  CLOUD_OPENAI_API_KEY: "os.environ/CLOUD_OPENAI_API_KEY"
  # OpenCode GO
  OPENCODE_GO_API_KEY: "os.environ/OPENCODE_GO_API_KEY"
  OPENCODE_GO_API_BASE: "os.environ/OPENCODE_GO_API_BASE"
