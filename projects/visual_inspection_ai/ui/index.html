<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローカル外観検査AI</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><header><h1>ローカル外観検査・寸法測定AI</h1><div id="health">接続確認中...</div></header>
<nav><button data-tab="inspect" class="active">検査</button><button data-tab="reviews">要確認</button><button data-tab="models">モデル</button><button data-tab="metrics">集計</button></nav>
<main>
<section id="tab-inspect" class="tab active"><h2>画像検査</h2><form id="inspect-form">
<label>製品 <select name="product_id"><option value="demo_press_part">デモ用金属プレス部品</option></select></label>
<label>ロット <input name="lot" placeholder="任意"></label><label>設備 <input name="equipment" placeholder="任意"></label>
<label class="file">画像 <input type="file" name="file" accept="image/*" required></label><button type="submit">検査実行</button></form>
<div id="inspect-message"></div><div id="result" class="result-grid"></div></section>
<section id="tab-reviews" class="tab"><h2>判定に迷ったもの</h2><div class="toolbar"><select id="review-status"><option>PENDING</option><option>REVIEWED</option><option>ALL</option></select><button id="reload-reviews">更新</button><a href="/api/reports/reviews.csv">CSV出力</a></div><div id="reviews"></div></section>
<section id="tab-models" class="tab"><h2>Champion / Challenger</h2><p>Challengerは自動昇格しません。固定評価と確認後に昇格してください。</p><button id="train-reference">基準モデル候補を作成</button><button id="reload-models">更新</button><div id="models"></div></section>
<section id="tab-metrics" class="tab"><h2>集計・性能</h2><button id="reload-metrics">更新</button><pre id="metrics"></pre></section>
</main><script src="/ui/app.js"></script></body></html>
