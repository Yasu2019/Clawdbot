app:
  name: "Local Visual Inspection AI"
  host: "127.0.0.1"
  port: 8000
  debug: false
  disable_external_api: true

paths:
  database: "data/inspection.db"
  runtime: "data/runtime"
  reports: "data/reports"
  product_recipes: "configs/products"
  model_registry: "models/registry.json"

learning:
  enabled: true
  min_confirmed_good: 20
  min_confirmed_total: 30
  idle_cpu_max_percent: 35
  idle_gpu_max_percent: 30
  min_free_gpu_mb: 5000
  cooldown_minutes: 60
  auto_promote: false

security:
  allow_remote_bind: false
  max_upload_mb: 25
  allowed_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".tif", ".tiff"]
