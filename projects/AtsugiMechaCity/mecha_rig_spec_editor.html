<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mecha Rig Spec Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"/>
<style>
  :root{
    --bg:#fafaf7; --surface:#fff; --txt:#1a1a18; --muted:#5f5e5a; --hint:#888780;
    --border:rgba(0,0,0,.14); --warn-bg:#faeeda; --warn:#854f0b; --ok-bg:#e1f5ee; --ok:#0f6e56;
    --danger:#a32d2d; --info:#185fa5; --r:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:24px; background:var(--bg); color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6;}
  .wrap{max-width:820px; margin:0 auto;}
  h1{font-size:20px; font-weight:500; margin:0 0 4px;}
  .sub{font-size:13px; color:var(--muted); margin:0 0 20px;}
  .bar{display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .badge{font-size:13px; font-weight:500; padding:6px 12px; border-radius:var(--r); background:var(--warn-bg); color:var(--warn);}
  .badge.ok{background:var(--ok-bg); color:var(--ok);}
  h2{font-size:14px; font-weight:500; margin:24px 0 8px;}
  .card{background:var(--surface); border:.5px solid var(--border); border-radius:var(--r); padding:10px 12px;}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .flag{border-left:3px solid var(--warn); border-radius:0;}
  .flag.done{border-left-color:var(--ok);}
  code{font-family:ui-monospace,Consolas,monospace; font-size:13px;}
  select,input,button{font:inherit; padding:6px 8px; border:.5px solid var(--border);
       border-radius:var(--r); background:var(--surface); color:var(--txt);}
  button{cursor:pointer;} button:hover{background:#f0efe8;} button:disabled{opacity:.5; cursor:default;}
  .strike{text-decoration:line-through; color:var(--danger); font-size:12px;}
  .right{font-weight:500; color:var(--ok);}
  .muted{color:var(--muted);} .hint{color:var(--hint); font-size:12px;}
  .primary{width:100%; justify-content:center; margin-top:8px; padding:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mecha Rig Spec Editor</h1>
  <p class="sub">自動分類器の提案を人が確定する human-in-the-loop ツール。分類器→<code>rig_spec.json</code>→[本エディタ]→Blender。</p>

  <div class="bar">
    <label class="card" style="cursor:pointer;"><i class="ti ti-upload"></i> rig_spec.json を読込
      <input type="file" id="file" accept="application/json" style="display:none;"/></label>
    <span id="ready" class="badge"><i class="ti ti-lock"></i> 仕様未読込</span>
    <button id="export" disabled onclick="exportSpec()"><i class="ti ti-download"></i> 編集済み仕様を保存</button>
  </div>

  <div id="content" class="hint">rig_spec.json を読み込むか、デモ（Zaku）で開始します。<button onclick="loadDemo()" style="margin-left:8px;">デモを読込</button></div>
</div>

<script>
const BONES=["Root","Hips","Chest","Neck","Head","UpperArm_L","UpperArm_R","LowerArm_L","LowerArm_R","Hand_L","Hand_R","UpperLeg_L","UpperLeg_R","LowerLeg_L","LowerLeg_R","Foot_L","Foot_R"];
const JTYPES=["hinge","revolute","ball","fixed"];
let spec=null;

const DEMO={schema:"clawstack.mecha_rig_spec.v1", model:"zaku",
 segments:[
  {name:"part_0",proposed_bone:"UpperLeg_R",confidence:0.07,flagged:true,bone:"UpperLeg_R",locked:false,proposal_source:"heuristic"},
  {name:"part_1",proposed_bone:"UpperLeg_L",confidence:0.03,flagged:true,bone:"UpperLeg_L",locked:false,proposal_source:"heuristic"},
  {name:"part_4",proposed_bone:"Chest",confidence:0.00,flagged:true,bone:"Chest",locked:false,proposal_source:"heuristic"},
  {name:"part_6",proposed_bone:"Head",confidence:1.0,flagged:true,bone:"Head",locked:false,proposal_source:"heuristic"},
  {name:"part_8",proposed_bone:"Hips",confidence:0.03,flagged:true,bone:"Hips",locked:false,proposal_source:"heuristic"},
  {name:"part_10",proposed_bone:"UpperArm_L",confidence:0.14,flagged:true,bone:"UpperArm_L",locked:false,proposal_source:"heuristic"},
  {name:"part_5",proposed_bone:"LowerArm_L",confidence:0.11,flagged:false,bone:"Chest",locked:true,proposal_source:"override"},
  {name:"part_14",proposed_bone:"Head",confidence:0.79,flagged:false,bone:"UpperArm_R",locked:true,proposal_source:"override"},
  {name:"part_11",proposed_bone:"Hand_R",confidence:0.87,flagged:false,bone:"LowerArm_R",locked:true,proposal_source:"override"},
  {name:"part_12",proposed_bone:"Foot_L",confidence:0.17,flagged:false,bone:"LowerLeg_L",locked:true,proposal_source:"override"}
 ],
 joints:[
  {name:"elbow_R",parent_bone:"UpperArm_R",child_bone:"LowerArm_R",type:"hinge",limits_deg:{min:-150,max:0}},
  {name:"knee_L",parent_bone:"UpperLeg_L",child_bone:"LowerLeg_L",type:"hinge",limits_deg:{min:0,max:150}},
  {name:"shoulder_L",parent_bone:"Chest",child_bone:"UpperArm_L",type:"ball",limits_deg:{min:-90,max:90}},
  {name:"head",parent_bone:"Neck",child_bone:"Head",type:"revolute",limits_deg:{min:-30,max:30}}
 ]};

document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ render(JSON.parse(r.result)); }catch(err){ alert("JSON読込失敗: "+err); } };
  r.readAsText(f);
});
function loadDemo(){ render(JSON.parse(JSON.stringify(DEMO))); }

function opt(sel){return BONES.map(b=>`<option ${b===sel?"selected":""}>${b}</option>`).join("");}

function render(s){
  spec=s;
  const flagged=s.segments.filter(x=>x.flagged);
  const armor=s.segments.filter(x=>x.proposal_source==="override");
  let h=`<h2><i class="ti ti-alert-triangle"></i> 要確認 (${flagged.length}) — マウスで確定</h2>`;
  h+=flagged.map((x,i)=>`<div class="card row flag" id="f${i}">
     <div style="flex:1; min-width:150px;"><code>${x.name}</code> <span class="hint">conf ${x.confidence.toFixed(2)}</span>
       <div class="hint">${x.confidence>=0.99?"サイズ異常・小ボーンに過大":"低信頼度・境界付近"}</div></div>
     <select id="s${i}">${opt(x.bone)}</select>
     <button id="b${i}" onclick="confirmRow(${i})"><i class="ti ti-check"></i> 確定</button></div>`).join("");

  h+=`<h2><i class="ti ti-shield-check"></i> 装甲の帰属（自動補正済み）</h2>`;
  h+=armor.map(a=>`<div class="card row" style="margin-bottom:6px;">
     <code style="min-width:64px;">${a.name}</code>
     <span class="strike">${a.proposed_bone}</span><i class="ti ti-arrow-right hint"></i>
     <span class="right">${a.bone}</span></div>`).join("");

  h+=`<h2><i class="ti ti-settings-2"></i> 関節の動作拘束</h2>`;
  h+=s.joints.map((j,i)=>`<div class="card row">
     <div style="flex:1; min-width:150px;"><b style="font-weight:500;">${j.name}</b>
       <div class="hint">${j.parent_bone} → ${j.child_bone}</div></div>
     <select id="jt${i}" onchange="jtype(${i})">${JTYPES.map(t=>`<option ${t===j.type?"selected":""}>${t}</option>`).join("")}</select>
     <input id="jn${i}" type="number" value="${j.limits_deg.min}" style="width:64px;"/>
     <span class="hint">–</span>
     <input id="jx${i}" type="number" value="${j.limits_deg.max}" style="width:64px;"/><span class="hint">°</span></div>`).join("");

  h+=`<button class="primary" id="build" disabled onclick="doBuild()"><i class="ti ti-player-play"></i> このリグ仕様でビルド</button>`;
  document.getElementById("content").innerHTML=h;
  document.getElementById("export").disabled=false;
  updateReady();
}
function confirmRow(i){
  const flagged=spec.segments.filter(x=>x.flagged);
  flagged[i].bone=document.getElementById("s"+i).value; flagged[i].locked=true;
  const r=document.getElementById("f"+i); r.classList.add("done");
  const b=document.getElementById("b"+i); b.disabled=true; b.innerHTML='<i class="ti ti-check"></i> 確定済';
  updateReady();
}
function jtype(i){
  const t=document.getElementById("jt"+i).value;
  document.getElementById("jn"+i).disabled=document.getElementById("jx"+i).disabled=(t==="fixed");
  spec.joints[i].type=t;
}
function updateReady(){
  const left=spec.segments.filter(x=>x.flagged&&!x.locked).length;
  const badge=document.getElementById("ready"), build=document.getElementById("build");
  if(left===0){ badge.className="badge ok"; badge.innerHTML='<i class="ti ti-circle-check"></i> ビルド可';
    if(build){build.disabled=false;} }
  else{ badge.className="badge"; badge.innerHTML='<i class="ti ti-lock"></i> 未確定 '+left; if(build){build.disabled=true;} }
}
function collect(){
  spec.joints.forEach((j,i)=>{ const mn=document.getElementById("jn"+i),mx=document.getElementById("jx"+i);
    if(mn){ j.type=document.getElementById("jt"+i).value; j.limits_deg={min:+mn.value,max:+mx.value}; }});
  return spec;
}
function exportSpec(){
  const s=collect(); const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=(s.model||"mecha")+"_rig_spec_edited.json"; a.click();
}
function doBuild(){ collect(); alert("rig_spec 確定。次は Blender ビルダーが本 JSON を読み armature + LIMIT_ROTATION を生成します（別スクリプト）。"); }
</script>
</body>
</html>
