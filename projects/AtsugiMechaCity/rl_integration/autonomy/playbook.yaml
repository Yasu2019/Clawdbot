# Motion Learning Playbook v1 — Stage A の10ラン(run1-10)から抽出した判断決定表。
# ローカルLLM/ルールエンジンはこの表の範囲でのみ自律判断する。表に無い状況は人間へエスカレーション。
# 教訓の出典: data/workspace/memory/trouble_history.md [T047] 罠#1〜#7

schema: clawstack.motion_learning_playbook.v1

success_gate:                # 「習得」判定(全条件AND)
  min_travel_m_8s: 1.5       # レンダーロールアウト(リセットなし)の実前進
  max_fall: false            # ロールアウト中に転倒しない(root zがstand_z-0.2を下回らない)
  min_upright: 0.90

rules:                       # 上から順に最初に一致したものを適用
  - name: learned
    when: "travel >= 1.5 and not fell"
    action: {type: success}

  - name: dive_hack          # 罠#7: 数値は良いが転倒して這っている
    when: "travel >= 1.0 and fell"
    action: {type: escalate, reason: "travel is fall-and-crawl; reward gating may be insufficient"}

  # v3 (2026-07-05 ユーザー承認): tier1bの教訓=「ノイズ収束後のチェックポイントを
  # 継承すると探索が死んだ保守の谷に沈む」(travel 0.067→0.028→0.028)。
  # 停滞系はフレッシュ+高探索+長時間へ。sprint/partial(良い挙動が出ている)のみ
  # latest継続だが、探索を殺さないinit_log_std(-1.1以上)を維持する。
  - name: conservative_freeze  # 安全静止に収束 → フレッシュ・高探索でやり直し
    when: "vx < 0.10 and not fell"
    action: {type: retrain, resume: best_walker, entropy: 0.003, init_log_std: -0.8, iterations: 3000}

  - name: sprint_and_fall    # 速すぎて転倒 → 直近を継続、探索は殺さない
    when: "vx >= 0.30 and fell"
    action: {type: retrain, resume: latest, entropy: 0.0015, init_log_std: -1.1, iterations: 2000}

  - name: partial_progress   # 歩いているが距離不足 → 継続熟成
    when: "travel >= 0.5"
    action: {type: retrain, resume: latest, entropy: 0.001, init_log_std: -1.1, iterations: 2000}

  - name: default_stall      # 停滞 → フレッシュ・高探索・長時間
    when: "true"
    action: {type: retrain, resume: best_walker, entropy: 0.002, init_log_std: -0.9, iterations: 3000}

limits:
  max_cycles_per_skill: 6            # これを超えたら人間へエスカレーション(無限ループ禁止)
  max_consecutive_no_improve: 2      # travelが2サイクル連続で改善しなければエスカレーション

escalation:
  file: escalation.md                # 出力先(サイクルディレクトリ内)
  telegram: true

known_good_checkpoints:
  # v3: 空=フレッシュ学習。教訓: ノイズ収束後(init_log_std<-1.2で焼き締めた)
  # チェックポイントをbest_walkerに登録してはならない — 探索が死んでいる。
  # 登録してよいのは「歩行が成立し(travel>1m)かつ探索が生きている」もののみ。
  best_walker: ""
